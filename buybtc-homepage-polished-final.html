  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.querySelector('[data-theme-toggle]');
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
      let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      const setToggle = () => { toggle.textContent = theme === 'dark' ? '☀' : '☾'; };
      setToggle();
      toggle.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', theme); setToggle(); });
      menuToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
      document.querySelectorAll('.faq-item').forEach(item => item.addEventListener('toggle', () => {
        const icon = item.querySelector('summary span');
        icon.textContent = item.open ? '−' : '+';
      }));
    })();
  </script>
